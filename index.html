<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars Survival Guide - Jezero mission planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__errors = [];
      window.addEventListener("error", (e) => {
        window.__errors.push(
          "error: " + String(e.message || e.filename || e.target?.tagName || "unknown"),
        );
      }, true);
      window.addEventListener("unhandledrejection", (e) =>
        window.__errors.push("rejection: " + String(e.reason)),
      );
      const _ce = console.error.bind(console);
      console.error = (...args) => {
        window.__errors.push("console.error: " + args.map(String).join(" | ").slice(0, 300));
        _ce(...args);
      };
    </script>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
